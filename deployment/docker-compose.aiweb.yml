services:
  aiweb:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LDXP_PLUS_URL: ${NEXT_PUBLIC_LDXP_PLUS_URL:-https://pay.ldxp.cn/item/knq3lq}
        NEXT_PUBLIC_LDXP_PRO_URL: ${NEXT_PUBLIC_LDXP_PRO_URL:-https://pay.ldxp.cn/item/c0zh71}
    container_name: aiweb
    env_file:
      - /opt/aiweb/.env.production
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 2g
    networks:
      - caddy
    restart: unless-stopped

networks:
  caddy:
    external: true
    name: ${AIWEB_CADDY_NETWORK}
